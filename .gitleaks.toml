# Secret scanning rules: gitleaks defaults plus the project's own key format.
[extend]
useDefault = true

[[rules]]
id = "tallyproof-signing-key"
description = "Tallyproof Ed25519 private signing key"
regex = '''tallyproof-ed25519-private-v1:[A-Za-z0-9+/]{42,44}={0,2}'''
keywords = ["tallyproof-ed25519-private-v1"]
