<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Background","default":"#0a0b10"},
    {"id":"color-ink","type":"color","label":"Text","default":"#f2f3f7"},
    {"id":"color-muted","type":"color","label":"Muted text","default":"#9ba1b4"},
    {"id":"color-accent","type":"color","label":"Accent","default":"#8b6cff"},
    {"id":"color-live","type":"color","label":"Live cyan","default":"#22d3ee"},
    {"id":"color-gold","type":"color","label":"Tally gold","default":"#f5b82e"},
    {"id":"font-display","type":"string","label":"Display font","default":"Fraunces"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Fraunces";
        font-style: normal;
        font-weight: 300 900;
        src: url("assets/fonts/fraunces-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Fraunces";
        font-style: italic;
        font-weight: 300 900;
        src: url("assets/fonts/fraunces-italic.woff2") format("woff2");
      }
      @font-face {
        font-family: "Manrope";
        font-style: normal;
        font-weight: 200 800;
        src: url("assets/fonts/manrope-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Caveat";
        font-style: normal;
        font-weight: 400 700;
        src: url("assets/fonts/caveat-normal.woff2") format("woff2");
      }
      :root {
        --ground: var(--color-ground, #0a0b10);
        --ink: var(--color-ink, #f2f3f7);
        --muted: var(--color-muted, #9ba1b4);
        --accent: var(--color-accent, #8b6cff);
        --live: var(--color-live, #22d3ee);
        --gold: var(--color-gold, #f5b82e);
        --ok: #3ddc84;
        --fail: #ff6b6b;
        --elevated: #12141c;
        --border: #232735;
        --font-display: var(--font-display, "Fraunces"), Georgia, serif;
        --font-sans: "Manrope", "Inter", sans-serif;
        --font-mono: "JetBrains Mono", "IBM Plex Mono", monospace;
        --font-script: "Caveat", cursive;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #ground {
        position: absolute;
        inset: 0;
        background: var(--ground);
      }
      #glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(900px 480px at 85% -10%, rgba(139, 108, 255, 0.2), transparent 60%),
          radial-gradient(600px 300px at 0% 110%, rgba(34, 211, 238, 0.09), transparent 70%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="70.1"
      data-width="1920"
      data-height="1080"
    >
      <div id="ground"></div>
      <div id="glow"></div>

      <div id="title" data-composition-id="title" data-composition-src="compositions/title.html" data-start="0" data-duration="8.6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="map" data-composition-id="map" data-composition-src="compositions/map.html" data-start="8.6" data-duration="57.1" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html" data-start="65.7" data-duration="4.4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <!-- Music: Sascha Ende, ende.app (CC BY 4.0). Quiet bed under the narration. -->
      <audio id="music" class="clip" data-start="0" data-duration="70.1" data-track-index="10" data-volume="0.11" data-fade-in="0.5" data-fade-out="1.8" src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3"></audio>

      <!-- Narration: Kokoro am_michael, American English, one clip per sentence group -->
      <audio id="vo-1" class="clip" data-start="0.4" data-duration="7.95" data-track-index="3" data-volume="1" src="assets/vo/line-1.wav"></audio>
      <audio id="vo-2" class="clip" data-start="9.4" data-duration="11.16" data-track-index="3" data-volume="1" src="assets/vo/line-2.wav"></audio>
      <audio id="vo-3" class="clip" data-start="21.0" data-duration="5.35" data-track-index="3" data-volume="1" src="assets/vo/line-3.wav"></audio>
      <audio id="vo-4" class="clip" data-start="26.8" data-duration="13.28" data-track-index="3" data-volume="1" src="assets/vo/line-4.wav"></audio>
      <audio id="vo-5" class="clip" data-start="40.5" data-duration="6.06" data-track-index="3" data-volume="1" src="assets/vo/line-5.wav"></audio>
      <audio id="vo-6" class="clip" data-start="47.0" data-duration="8.87" data-track-index="3" data-volume="1" src="assets/vo/line-6.wav"></audio>
      <audio id="vo-7" class="clip" data-start="56.3" data-duration="8.98" data-track-index="3" data-volume="1" src="assets/vo/line-7.wav"></audio>
      <audio id="vo-8" class="clip" data-start="66.1" data-duration="3.63" data-track-index="3" data-volume="1" src="assets/vo/line-8.wav"></audio>

      <!-- Two sound marks only: the name landing, and the closing mark -->
      <audio id="sfx-name" class="clip" data-start="0.25" data-duration="0.19" data-track-index="11" data-volume="0.5" src="assets/sfx/impact/impactSoft_medium_001.ogg"></audio>
      <audio id="sfx-mark" class="clip" data-start="66.0" data-duration="1.48" data-track-index="11" data-volume="0.45" src="assets/sfx/impact/impactBell_heavy_000.ogg"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
