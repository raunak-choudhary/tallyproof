# Publishes the static demo site, with the documentation site under /docs/, to
# GitHub Pages. Build, test, and lint stay on CircleCI; this workflow only
# deploys, with the built-in token (ADR-0020).
name: Publish demo site

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "docs/**"
      - "mkdocs.yml"
      - "backend/tallyproof_core/**"
      - "backend/apps/analyst/**"
      - "backend/requirements-docs.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build the static export under the repository's path
        run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_PINNED_VERIFIER_KEY: ${{ vars.PINNED_VERIFIER_KEY }}
          NEXT_PUBLIC_API_URL: ""
          NEXT_PUBLIC_BUILD_COMMIT: ${{ github.sha }}
          NEXT_PUBLIC_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          NEXT_PUBLIC_WITNESS_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/witness/replay/checkpoints.jsonl
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.9"
      - name: Build the documentation site under /docs/
        working-directory: .
        run: |
          python -m pip install --require-hashes --no-deps -r backend/requirements-docs.txt
          mkdocs build --strict --site-dir frontend/out/docs
        env:
          NO_MKDOCS_2_WARNING: "1"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
