version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: "docker"
    directory: "/infra"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci(deps)"
