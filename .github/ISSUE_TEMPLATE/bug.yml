name: Bug report
description: Something does not behave as documented
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the scenario seed if relevant
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit SHA or release
