name: Task
description: A planned unit of work
labels: []
body:
  - type: input
    id: task_id
    attributes:
      label: Task ID
      description: The task's identifier in the project plan
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What this task delivers and why
    validations:
      required: true
  - type: textarea
    id: exit
    attributes:
      label: Exit criteria
      description: What must be true to close this issue
    validations:
      required: true
  - type: input
    id: reqs
    attributes:
      label: Related documents
      description: Decision records or docs this task affects, for example docs/adr/0014-constrained-query-ir.md
