name: Task
description: A planned unit of work from docs/06-implementation-plan.md
labels: []
body:
  - type: input
    id: task_id
    attributes:
      label: Task ID
      description: For example T-106 or E-501
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What this task delivers and why
    validations:
      required: true
  - type: textarea
    id: exit
    attributes:
      label: Exit criteria
      description: What must be true to close this issue
    validations:
      required: true
  - type: input
    id: reqs
    attributes:
      label: Requirements covered
      description: REQ-IDs from docs/traceability-matrix.md
