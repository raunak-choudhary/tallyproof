[project]
name = "tallyproof"
version = "0.0.0"
description = "A streaming, verifiable ledger for public spending data with an AI analyst whose claims carry Merkle proofs"
readme = "../README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle and pyflakes
    "I",            # import order
    "B",            # bugbear
    "UP",           # modern syntax
    "SIM",          # simplifications
    "N",            # naming
    "D",            # docstrings
    "S",            # security checks from bandit
    "PT",           # pytest style
    "RUF",          # ruff-specific rules
    "ANN",          # type annotations
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests use plain asserts, seeded (non-cryptographic) random generators for
# reproducibility, and describe themselves through their names.
"tests/**" = ["S101", "S311", "D", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["tallyproof_core", "tallyproof_pipeline", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["tallyproof_core", "tallyproof_pipeline"]

[tool.coverage.report]
# The build fails if coverage of the core code drops below this.
fail_under = 85
show_missing = true
skip_covered = true
