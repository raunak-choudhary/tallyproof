[project]
name = "tallyproof"
version = "0.0.0"
description = "A streaming, verifiable ledger for public spending data with an AI analyst whose claims carry Merkle proofs"
readme = "../README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle and pyflakes
    "I",            # import order
    "B",            # bugbear
    "UP",           # modern syntax
    "SIM",          # simplifications
    "N",            # naming
    "D",            # docstrings
    "S",            # security checks from bandit
    "PT",           # pytest style
    "RUF",          # ruff-specific rules
    "ANN",          # type annotations
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests use plain asserts, seeded (non-cryptographic) random generators for
# reproducibility, and describe themselves through their names.
"tests/**" = ["S101", "S311", "D", "ANN"]
# Settings modules re-export the base settings with star imports by design.
"config/settings/*.py" = ["F403", "F401"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["tallyproof_core", "tallyproof_pipeline", "config", "apps", "tests"]
plugins = ["pydantic.mypy", "mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[[tool.mypy.overrides]]
# PyDeequ ships no type information.
module = ["pydeequ", "pydeequ.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
markers = ["spark: needs Java 17 and starts a local Spark session"]
filterwarnings = [
    # py4j, the Python-to-JVM bridge Spark uses, leaves local sockets for the
    # garbage collector to close. Harmless, and not something this project controls.
    "ignore:unclosed <socket.socket:ResourceWarning",
    # PyDeequ builds result DataFrames through a Spark constructor marked internal.
    "ignore:DataFrame constructor is internal:UserWarning",
]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["tallyproof_core", "tallyproof_pipeline", "config", "apps"]
# Server entry points and per-environment settings only wire things together.
omit = ["config/wsgi.py", "config/asgi.py", "config/settings/local.py", "config/settings/ci.py"]

[tool.coverage.report]
# The build fails if coverage of the core code drops below this.
fail_under = 85
show_missing = true
skip_covered = true
