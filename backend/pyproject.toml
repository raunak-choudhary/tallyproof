[project]
name = "tallyproof"
version = "1.0.0"
description = "A streaming, verifiable ledger for public spending data with an AI analyst whose claims carry Merkle proofs"
readme = "../README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle and pyflakes
    "I",            # import order
    "B",            # bugbear
    "UP",           # modern syntax
    "SIM",          # simplifications
    "N",            # naming
    "D",            # docstrings
    "S",            # security checks from bandit
    "PT",           # pytest style
    "RUF",          # ruff-specific rules
    "ANN",          # type annotations
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests use plain asserts, seeded (non-cryptographic) random generators for
# reproducibility, and describe themselves through their names.
"tests/**" = ["S101", "S311", "D", "ANN"]
# Settings modules re-export the base settings with star imports by design.
"config/settings/*.py" = ["F403", "F401"]
# Django declares Meta options and migration operations as mutable class
# attributes by design. Migrations are generated or hold SQL built only from
# module constants, and are documented by their module docstrings.
"apps/*/models.py" = ["RUF012", "D105", "D106"]
"apps/**/serializers.py" = ["RUF012", "D106"]
"apps/*/migrations/*.py" = ["RUF012", "D", "E501", "S608"]
# The query compiler builds SQL from catalog identifiers only; every value is a
# bound parameter. Its unit tests pin the exact SQL it emits.
"apps/analyst/compiler.py" = ["S608"]
# The guard's test corpus builds hostile SQL on purpose.
"tests/unit/analyst/test_sql_guard.py" = ["S101", "D", "ANN", "S608", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["tallyproof_core", "tallyproof_pipeline", "config", "apps", "evals", "tests"]
plugins = ["pydantic.mypy", "mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[[tool.mypy.overrides]]
# asgiref's test helpers are untyped.
module = ["tests.unit.realtime.*", "tests.module.realtime.*"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# PyDeequ ships no type information.
module = ["pydeequ", "pydeequ.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyArrow ships no type information.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "spark: needs Java 17 and starts a local Spark session",
    "integration: needs Docker; starts real Postgres or Redpanda containers",
]
filterwarnings = [
    # py4j, the Python-to-JVM bridge Spark uses, leaves local sockets for the
    # garbage collector to close. Harmless, and not something this project controls.
    "ignore:unclosed <socket.socket:ResourceWarning",
    # PyDeequ builds result DataFrames through a Spark constructor marked internal.
    "ignore:DataFrame constructor is internal:UserWarning",
]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["tallyproof_core", "tallyproof_pipeline", "config", "apps", "evals"]
# Server entry points and per-environment settings only wire things together.
omit = ["config/wsgi.py", "config/asgi.py", "config/settings/local.py", "config/settings/ci.py"]

[tool.coverage.report]
# The build fails if coverage of unit, Spark, and integration tests together drops below this.
fail_under = 85
show_missing = true
skip_covered = true
