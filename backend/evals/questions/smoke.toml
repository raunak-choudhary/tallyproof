[[question]]
id = "S007"
text = "What was modification P00001 on contract 47QSEA24F0REK worth?"
category = "lookup"
expect = { kind = "lookup", entity = "obligations", piid = "47QSEA24F0REK", modification_number = "P00001", event_type = "obligation.adjusted", fields = ["amount"] }

