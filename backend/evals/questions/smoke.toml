# Smoke set: 20 fixed template questions.
# Generated by `python -m evals.golden`; don't edit by hand.

[[question]]
id = "S001"
text = "Total outlays reported for Department of Defense?"
category = "numeric_aggregate"
expect = { kind = "sum", entity = "outlays", awarding_agency = "Department of Defense" }

[[question]]
id = "S002"
text = "Number of obligation records for National Aeronautics and Space Administration?"
category = "numeric_aggregate"
expect = { kind = "count", entity = "obligations", awarding_agency = "National Aeronautics and Space Administration" }

[[question]]
id = "S003"
text = "How many contract actions did Department of Health and Human Services record?"
category = "numeric_aggregate"
expect = { kind = "count", entity = "obligations", awarding_agency = "Department of Health and Human Services" }

[[question]]
id = "S004"
text = "What were total outlays in fiscal period 4 of 2024?"
category = "numeric_aggregate"
expect = { kind = "sum", entity = "outlays", fiscal_year = 2024, fiscal_period = 4 }

[[question]]
id = "S005"
text = "Total contract obligations for Department of Health and Human Services in FY2024?"
category = "numeric_aggregate"
expect = { kind = "sum", entity = "obligations", awarding_agency = "Department of Health and Human Services", fiscal_year = 2024 }

[[question]]
id = "S006"
text = "How much has Department of Agriculture paid out on contracts?"
category = "numeric_aggregate"
