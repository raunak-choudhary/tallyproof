# Held-out questions. Frozen 2026-10-28, before any prompt or router work.
#
# Never use these to tune prompts, the router, or the query compiler. Reports show
# the gap between template and held-out scores; a large gap means overfitting.
#
# Each question names what the oracle should compute (`expect`), in the oracle's
# own terms, not the analyst's. The oracle computes the exact answer from the
# evaluation dataset in testdata/eval. `verified` holds an answer checked by hand
# with a separate script that shares no code with this project; the oracle must
# agree with it. Amounts are in dollars, fiscal years are federal (October start).

[[question]]
id = "H01"
text = "What did HHS obligate on contracts in fiscal 2024?"
category = "numeric_aggregate"
expect = { kind = "sum", entity = "obligations", awarding_agency = "Department of Health and Human Services", fiscal_year = 2024 }
verified = { amount = "17049347.67", events = 29 }

[[question]]
id = "H02"
text = "Total dollars the Department of Transportation committed to contracts during FY24?"
category = "numeric_aggregate"
expect = { kind = "sum", entity = "obligations", awarding_agency = "Department of Transportation", fiscal_year = 2024 }
verified = { amount = "8718816.56" }

[[question]]
id = "H03"
text = "How much has Interior actually paid out on its contracts so far?"
category = "numeric_aggregate"
