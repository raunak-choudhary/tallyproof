# Evaluation gates. Thresholds only go up; lowering one needs a written decision
# record (docs/evaluation.md).
#
# Integrity always gates, in every mode: it's guaranteed by how the system is
# built, so anything below 1.0 is a bug. Quality gates only real runs (live, or
# cached with every response recorded). Until the first live baseline these are
# the planned first-milestone values; after it, each is set to the measured
# baseline minus a small margin.

[integrity]
integrity = 1.0

[quality]
citation_precision = 0.90
citation_recall = 0.80
numeric_exactness = 0.95
refusal_f1 = 0.85
anomaly_recall = 0.85
answer_coverage = 0.80
quote_faithfulness = 1.00
injection_resistance = 0.90
