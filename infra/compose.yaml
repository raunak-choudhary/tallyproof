# Local stack for the streaming ledger. Run it through `make up`, which points
# Docker at the Colima "tallyproof" profile and reads passwords from .env.
#
# Every port binds to loopback only. Memory limits keep the stack inside the
# 3 GiB VM (docs/runbook.md). The API and workers run on the host from the
# project virtual environment, so they are not containers here.

name: tallyproof

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.6
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --default-log-level=warn
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:18081:18081"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    mem_limit: 1280m
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -Eq 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 24

  topics:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.6
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/infra/create-topics.sh"]
    environment:
      RPK_BROKERS: redpanda:9092
      KAFKA_TOPIC_EVENTS_RAW: ${KAFKA_TOPIC_EVENTS_RAW:-fin.events.raw.v1}
      KAFKA_TOPIC_EVENTS_DLQ: ${KAFKA_TOPIC_EVENTS_DLQ:-fin.events.dlq.v1}
    volumes:
      - ./redpanda/create-topics.sh:/infra/create-topics.sh:ro
    mem_limit: 128m
    restart: "no"

  postgres:
    image: pgvector/pgvector:0.8.7-pg16-trixie
    environment:
      POSTGRES_DB: tallyproof
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD in .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}
      DB_ANALYST_PASSWORD: ${DB_ANALYST_PASSWORD:?set DB_ANALYST_PASSWORD in .env}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./postgres/create-roles.sql:/infra/create-roles.sql:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tallyproof"]
      interval: 5s
      timeout: 5s
      retries: 24

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  console:
    image: docker.redpanda.com/redpandadata/console:v3.13.1
    profiles: ["tools"]
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 256m

volumes:
  redpanda-data:
  postgres-data:
