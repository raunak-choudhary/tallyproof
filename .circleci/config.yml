# Tallyproof CI. Each job runs the same make target a developer runs locally.
# The ci-gate job depends on every check and is the only required status check
# on main, so adding or removing jobs never requires changing branch protection.
version: 2.1

executors:
  python:
    docker:
      - image: cimg/python:3.12.9
    resource_class: small
  node:
    docker:
      - image: cimg/node:22.23.4
    resource_class: small

commands:
  setup-python:
    description: Check out the code and install the pinned Python dependencies
    steps:
      - checkout
      - restore_cache:
          keys:
            - venv-v1-{{ arch }}-{{ checksum "backend/requirements.txt" }}-{{ checksum "backend/requirements-dev.txt" }}
      - run:
          name: Install pinned dependencies
          command: make venv PYTHON=python3.12
      - save_cache:
          key: venv-v1-{{ arch }}-{{ checksum "backend/requirements.txt" }}-{{ checksum "backend/requirements-dev.txt" }}
          paths:
            - backend/.venv

  setup-machine-python:
    description: Check out the code and install Python dependencies on a VM that can run Docker
    steps:
      - checkout
      - run:
          name: Install the Python 3.12 venv module
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3.12-venv
      - restore_cache:
          keys:
            - venv-machine-v1-{{ arch }}-{{ checksum "backend/requirements.txt" }}-{{ checksum "backend/requirements-dev.txt" }}
      - run:
          name: Install pinned dependencies
          command: make venv PYTHON=/usr/bin/python3.12
      - save_cache:
          key: venv-machine-v1-{{ arch }}-{{ checksum "backend/requirements.txt" }}-{{ checksum "backend/requirements-dev.txt" }}
          paths:
            - backend/.venv

  run-eval:
    description: Run one evaluation in a throwaway database and keep its reports
    parameters:
      set:
        type: string
      mode:
        type: string
    steps:
      - restore_cache:
          keys:
            - embeddings-v1-{{ checksum "backend/corpus/far/manifest.json" }}
      - run:
          name: Evaluate << parameters.set >> in << parameters.mode >> mode
          command: make eval SET=<< parameters.set >> MODE=<< parameters.mode >>
          no_output_timeout: 30m
      - save_cache:
          key: embeddings-v1-{{ checksum "backend/corpus/far/manifest.json" }}
          paths:
            - var/embeddings
      - store_artifacts:
          path: var/eval
          destination: eval

jobs:
  lint:
    executor: python
    steps:
      - setup-python
      - run:
          name: Lint and formatting
          command: make lint
      - run:
          name: Documentation site builds with no broken links
          command: make docs-build

  typecheck:
    executor: python
    steps:
      - setup-python
      - run:
          name: Strict type checking
          command: make typecheck

  unit-tests:
    executor: python
    steps:
      - setup-python
      - run:
          name: Unit tests with coverage
          command: make test TEST_MARKERS="not spark and not integration" COVERAGE_NAME=unit
          environment:
            # Spark tests need Java and run in their own job.
            PYTEST_ADDOPTS: --junitxml=test-results/junit.xml
            # Deterministic, larger property-based test runs, so failures reproduce exactly.
            HYPOTHESIS_PROFILE: ci
      - store_test_results:
          path: backend/test-results
      - persist_to_workspace:
          root: backend
          paths:
            - .coverage.unit

  spark-tests:
    executor: python
    resource_class: medium
    steps:
      - setup-python
      - run:
          name: Install Java 17 for Spark
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq openjdk-17-jre-headless
      - run:
          name: Spark and Deequ tests
          command: make test TEST_MARKERS=spark COVERAGE_NAME=spark JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          environment:
            PYTEST_ADDOPTS: --junitxml=test-results/junit.xml
      - store_test_results:
          path: backend/test-results
      - persist_to_workspace:
          root: backend
          paths:
            - .coverage.spark

  # Testcontainers needs a real Docker daemon, so this job runs on a Linux VM
  # rather than inside a container.
  integration-tests:
    machine:
      image: ubuntu-2404:2024.11.1
    resource_class: medium
    steps:
      - setup-machine-python
      - run:
          name: Integration tests against real Postgres and Redpanda
          command: make test-integration
          environment:
            PYTEST_ADDOPTS: --junitxml=test-results/junit.xml
      - store_test_results:
          path: backend/test-results
      - persist_to_workspace:
          root: backend
          paths:
            - .coverage.integration

  coverage:
    executor: python
    steps:
      - setup-python
      - attach_workspace:
          at: backend
      - run:
          name: Combined coverage of every suite must reach the threshold
          command: make coverage-report
      - store_artifacts:
          path: backend/coverage.xml
          destination: coverage/coverage.xml

  dependency-audit:
    executor: python
    steps:
      - setup-python
      - run:
          name: Scan pinned dependencies for known vulnerabilities
          command: make audit

  commit-messages:
    executor: python
    steps:
      - checkout
      - run:
          name: Every commit follows Conventional Commits
          command: |
            git fetch --quiet origin main
            if [ "$CIRCLE_BRANCH" = "main" ]; then
              base="<< pipeline.git.base_revision >>"
              range="${base:-HEAD~1}..HEAD"
            else
              range="origin/main..HEAD"
            fi
            echo "Checking commits in $range"
            python3 scripts/ci/check_commit_messages.py "$range"

  secret-scan:
    executor: python
    environment:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - checkout
      - run:
          name: Install gitleaks and verify its checksum
          command: |
            base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
            tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
            curl -sSfL -o "/tmp/${tarball}" "${base}/${tarball}"
            curl -sSfL -o /tmp/checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
            (cd /tmp && grep " ${tarball}\$" checksums.txt | sha256sum --check --strict)
            tar -xzf "/tmp/${tarball}" -C /tmp gitleaks
      - run:
          name: Scan the full history for secrets
          # Only this branch's history: by default gitleaks reads every fetched ref,
          # which would judge other branches by this branch's rules.
          command: /tmp/gitleaks git --config .gitleaks.toml --redact --verbose --log-opts="HEAD" .

  web-checks:
    executor: node
    steps:
      - checkout
      - run:
          name: Use the pnpm version pinned in package.json
          command: sudo corepack enable && corepack install --global pnpm@10.34.1
      - restore_cache:
          keys:
            - pnpm-v1-{{ checksum "frontend/pnpm-lock.yaml" }}
      - run:
          name: Install locked dependencies
          command: make web-install
      - save_cache:
          key: pnpm-v1-{{ checksum "frontend/pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store
      - run:
          name: Lint, type-check, and test the web app
          command: make web-check
      - run:
          name: Browser tests at six viewports in both themes
          command: make web-e2e
      - store_artifacts:
          path: frontend/playwright-report
          destination: playwright-report

  # Pull requests replay recorded model responses and never receive a key. Until
  # recordings exist, the run is a harness check: integrity gates, quality doesn't.
  eval-smoke:
    machine:
      image: ubuntu-2404:2024.11.1
    resource_class: medium
    steps:
      - setup-machine-python
      - run-eval:
          set: smoke
          mode: cached
      - run:
          name: Changes to the analyst come with recorded responses
          command: |
            if [ "$CIRCLE_BRANCH" = "main" ]; then
              echo "On main: the pull request was already checked."
              exit 0
            fi
            git fetch --quiet origin main
            python3 scripts/ci/check_eval_recordings.py "origin/main...HEAD"

  # Weekly, from a scheduled trigger only. The llm-eval context holds the provider key and is limited to main.
  eval-weekly:
    machine:
      image: ubuntu-2404:2024.11.1
    resource_class: medium
    environment:
      LLM_PROVIDER: openai_compatible
    steps:
      - setup-machine-python
      - run-eval:
          set: all
          mode: live

  ci-gate:
    executor: python
    steps:
      - run:
          name: All required checks passed
          command: echo "Backend, integration, coverage, web, and evaluation checks, audit, commit messages, and secret scan all passed."

workflows:
  checks:
    when:
      not:
        equal: [scheduled_pipeline, << pipeline.trigger_source >>]
    jobs:
      - lint
      - typecheck
      - unit-tests
      - spark-tests
      - integration-tests
      - coverage:
          requires:
            - unit-tests
            - spark-tests
            - integration-tests
      - dependency-audit
      - commit-messages
      - secret-scan
      - web-checks
      - eval-smoke
      - ci-gate:
          requires:
            - lint
            - typecheck
            - unit-tests
            - spark-tests
            - integration-tests
            - coverage
            - dependency-audit
            - commit-messages
            - secret-scan
            - web-checks
            - eval-smoke

  weekly-eval:
    when:
      equal: [scheduled_pipeline, << pipeline.trigger_source >>]
    jobs:
      - eval-weekly:
          context: llm-eval
